spring:
  application:
    name: bank-app
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

bank:
  # Largest single transfer the bank will process; larger ones are rejected with LIMIT_EXCEEDED.
  transfer-limit: 10000.00
