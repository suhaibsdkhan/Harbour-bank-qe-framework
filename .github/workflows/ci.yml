name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly regression run, 06:00 Toronto time.
    - cron: "0 10 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  java-tests:
    name: JUnit + Cucumber (API, SQL, Playwright, Selenium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bank
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Browsers are installed explicitly below; stop Playwright from fetching Firefox/WebKit too.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the bank app and compile the tests
        run: ./mvnw -B -ntp install -DskipTests

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Install Playwright Chromium
        run: >-
          ./mvnw -B -ntp -pl bank-tests exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Run unit tests, then JUnit and Cucumber suites against Postgres
        run: >-
          ./mvnw -B -ntp verify
          -Ddb.url=jdbc:postgresql://localhost:5432/bank
          -Ddb.user=bank
          -Ddb.password=bank

      - name: Enforce the coverage gate (lines >= 90%, branches >= 85%)
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, sys
          m = {"LINE": [0, 0], "BRANCH": [0, 0]}
          for r in csv.DictReader(open("bank-tests/target/site/jacoco-aggregate/jacoco.csv")):
              for k in m:
                  m[k][0] += int(r[k + "_MISSED"]); m[k][1] += int(r[k + "_COVERED"])
          pct = {k: 100 * c / (mi + c) for k, (mi, c) in m.items()}
          print("### bank-app code coverage (unit + end-to-end)\n")
          print(f"| Lines | Branches |\n|---|---|\n| {pct['LINE']:.1f}% | {pct['BRANCH']:.1f}% |")
          if pct["LINE"] < 90 or pct["BRANCH"] < 85:
              print("\n**Coverage gate failed.**")
              sys.exit(1)
          PY

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-java
          path: |
            bank-app/target/allure-results
            bank-tests/target/allure-results
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: bank-tests/target/site/jacoco-aggregate
          if-no-files-found: ignore

      - name: Upload Cucumber and Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            bank-tests/target/cucumber
            bank-tests/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: bank-app/target/surefire-reports
          if-no-files-found: ignore

  postman:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build and start the bank app
        run: |
          ./mvnw -B -ntp -pl bank-app package -DskipTests
          nohup java -jar bank-app/target/bank-app-*-exec.jar > app.log 2>&1 &
          timeout 90 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'

      - name: Run the Postman collection
        run: |
          npm ci
          npm run test:postman

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-newman
          path: target/allure-results-newman
          if-no-files-found: ignore

      - name: Upload Newman JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit
          path: target/newman/junit.xml
          if-no-files-found: ignore

      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postman-app-log
          path: app.log

  selenium-firefox:
    name: Selenium on Firefox (cross-browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the Selenium suite in Firefox
        run: |
          ./mvnw -B -ntp install -DskipTests
          ./mvnw -B -ntp verify -pl bank-tests -Dgroups=selenium -Dselenium.browser=firefox -Djacoco.skip=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-firefox
          path: bank-tests/target/allure-results
          if-no-files-found: ignore

  performance:
    name: Gatling load test + post-load reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start the app and Postgres with Docker Compose
        run: |
          ./mvnw -B -ntp install -DskipTests -Djacoco.skip=true
          docker compose up -d --build --wait

      - name: Run the load test (SLA assertions fail the job)
        run: |
          set -o pipefail
          ./mvnw -B -ntp -pl bank-perf gatling:test -Dusers=20 -DdurationSeconds=60 | tee gatling.log
          {
            echo "### Load test"
            echo '```'
            sed -n '/---- Global Information/,/^====/p' gatling.log
            grep -E '^(Global|Transfer):' gatling.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile the ledger after load
        run: >-
          ./mvnw -B -ntp verify -pl bank-tests -Dgroups=db -Djacoco.skip=true
          -Dbase.url=http://localhost:8080
          -Ddb.url=jdbc:postgresql://localhost:5432/bank -Ddb.user=bank -Ddb.password=bank

      - name: Collect the Gatling report
        if: always()
        run: |
          mkdir -p perf-report
          cp -r bank-perf/target/gatling/transferloadsimulation-*/. perf-report/ 2>/dev/null || true
          docker compose logs app > app.log 2>&1 || true

      - name: Upload the Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: perf-report
          if-no-files-found: ignore

      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-app-log
          path: app.log

  publish-results:
    name: Publish results to the test dashboard
    # Sends every main-branch run, failures included, to the Secure Test Results Dashboard
    # (github.com/suhaibsdkhan/secure-test-dashboard). Skipped until the DASHBOARD_URL
    # variable and DASHBOARD_INGEST_TOKEN secret are set.
    needs: [java-tests, postman]
    if: always() && vars.DASHBOARD_URL != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A suite may have died before uploading its report; publish whatever exists.
      - name: Download unit test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-test-reports
          path: reports/unit

      - name: Download Surefire reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: java-test-reports
          path: reports/e2e

      - name: Download Newman report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: newman-junit
          path: reports/newman

      - name: Upload to the dashboard
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::DASHBOARD_INGEST_TOKEN is not set; skipping upload"
            exit 0
          fi
          publish() {
            [ -s "$2" ] || { echo "No $1 results to publish"; return; }
            curl -fsS --retry 3 -X POST \
              "$DASHBOARD_URL/api/runs?project=$1&branch=$GITHUB_REF_NAME&commit=$GITHUB_SHA" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/xml" \
              --data-binary "@$2" \
              || echo "::warning::Could not publish $1 results to the dashboard"
            echo
          }
          node scripts/merge-junit.mjs reports/unit > unit.xml || true
          node scripts/merge-junit.mjs reports/e2e/surefire-reports > e2e.xml || true
          publish harbour-bank-unit unit.xml
          publish harbour-bank-e2e e2e.xml
          publish harbour-bank-postman reports/newman/junit.xml

  report:
    name: Allure report
    needs: [java-tests, selenium-firefox, postman, performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Collect results from every suite
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Add history, categories and environment
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$PAGES_URL/history/$f" -o "allure-results/history/$f" || true
          done
          cp .allure/categories.json allure-results/
          cat > allure-results/environment.properties <<PROPS
          App=Harbour Bank (Spring Boot 3.5, Java 21)
          Database=PostgreSQL 16 (JUnit/Cucumber), H2 (Newman, Firefox)
          Branch=${GITHUB_REF_NAME}
          Commit=${GITHUB_SHA::7}
          PROPS
          sed -i 's/^ *//' allure-results/environment.properties
          cat > allure-results/executor.json <<JSON
          {"name":"GitHub Actions","type":"github","buildName":"CI #${GITHUB_RUN_NUMBER}",
           "buildUrl":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
           "reportUrl":"${PAGES_URL}/"}
          JSON

      - name: Generate the report
        run: |
          npm ci
          npx allure generate allure-results --clean -o allure-report
          jq -r '.statistic | "### Allure summary\n\n| Passed | Failed | Broken | Skipped | Total |\n|---|---|---|---|---|\n| \(.passed) | \(.failed) | \(.broken) | \(.skipped) | \(.total) |"' \
            allure-report/widgets/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Add the coverage report under /coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: allure-report/coverage

      - name: Add the Gatling report under /performance
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: performance-report
          path: allure-report/performance

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Package the report for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    name: Publish report to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
